services:
  db:
    image: postgis/postgis:16-3.4
    container_name: virtual-excursions-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtual_excursions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
